#配置用户或者组，默认为nobody nobody;
#user nobody

#启动进程，通常设置成和CPU数量相等或者2倍于CPU的个数（具体结合CPU和内存）。默认为1（通俗来说允许生成的进程数）
worker_processes 1;

#全局的错误日志存放路径和日志级别[ debug | info | notice | warn | error | crit ]
#error logs/error.log;
#error logs/error.log notice;
#error logs/error.log info;

#pid 进程文件 指定nginx进程远程文件存放地址
#pid         logs/nginx.pid;

#工作模式以及连接数上限
events {
    #accept_mutesx on; #设置网路连接序列化，防止惊群现象发生，默认为no
    #multi_accept on;  #设置一个进程是否同时接受多个网络连接，默认为off
    #use epoll;        #事件驱动型，select | poll | kqueue | epoll | resig | /dev/poll | eventport
    worker_connections 1024;#最大连接数，默认为512
}


http {
    #设定mime类型，类型由mime.type文件定义。文件拓展名与文件类型映射表
    include       mime.types;
    #默认文件类型  默认为text/plain
    default_type  application/octet-stream;

    #设定日志格式
    #log_format main '$remote_addr - $remote_user [$time_local] "request" '
    #                '$status $body_bytes_sent "http_referer" '
    #                '"$http_user_agent" "$http_x_forwarded_for"';

    #access日志文件的路径，采用上面定义的main 格式记录
    #access_log logs/access.log      main;

    #开启高效文件传输模式，sendfile指令指定nginx是否调用sendfile函数来输出文件，
    #对于普通应用设为 on，如果用来进行下载等应用磁盘I0重负载应用，可设置为off，
    #以平衡磁盘与网络I/0处理熟速度，降低系统的负债。注意：如果图片显示不正常把这个改成off。默认开启状态

    sendfile        on;

    #防止网络阻塞
    #tcp_nopush     on;

    #长连接超时时间，单位是秒
    #keepalive_timeout   0;
    keepalive_timeout   65;

    #开启gzip压缩输出
    #gzip  on;

    #虚拟机的配置
    server {
        #监听窗口
        listen        80;
        #定义使用localhost，也可以自定义域名访问
        #域名可以有多个空格隔开
        server_name  localhost;

        #字符编码
        #charest koi8-r;

        #日志位置
        #access_log  logs/host.access.log  main

        #默认请求
        location / {
            # #定义服务器的默认网站根目录位置
            # root  html;
            # root /root;
            # #定义首页索引文件的名称 定义多个用空格隔开
            # index index.html;

            root /usr/share/nginx/html;
            index index.html;

        }

        #定义404错误提示页面
        #error_page 404             /404.html

        error_page 404 /index.html;

        # redirect server error pages to the static page /50x.html
        # 定义 50x错误提示页面
        error_page  500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }

    }
}